<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="How I work: discover, define, design, prototype, deliver, release. AI agents build from my specifications, and every result is reviewed and tested before it counts." font-family="'Schibsted Grotesk', 'Inter', 'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>How I work: discover, define, design, prototype, deliver, release. AI agents build from my specifications, and every result is reviewed and tested before it counts.</title>
<defs>
  <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161920"/><stop offset="1" stop-color="#0F1115"/></linearGradient>
  
  <filter id="t-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .95  0 0 0 0 .9  0 0 0 0 .88  1.2 0 0 0 -.7"/></filter>
  <pattern id="t-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
  <clipPath id="t-clip"><rect width="1280" height="330" rx="28"/></clipPath>
</defs>
<rect width="1280" height="330" rx="28" fill="url(#t-bg)"/>

<rect width="1280" height="330" rx="28" fill="url(#t-dots)"/>
<rect x=".5" y=".5" width="1279" height="329" rx="28" fill="none" stroke="#262A32"/>
<line x1="140" y1="96" x2="1140" y2="96" stroke="#262A32" stroke-width="3"/>
<circle cx="140" cy="96" r="28" fill="#1E222B" stroke="#ECEDEF" stroke-opacity=".7" stroke-width="2"/>
<text x="140" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#8FA3FF">1</text>
<text x="140" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#ECEDEF">Discover</text>
<text x="140" y="194" text-anchor="middle" font-size="15" fill="#8E939C">Frame the right problem</text>
<text x="140" y="214" text-anchor="middle" font-size="15" fill="#8E939C">with those who have it</text>
<circle cx="340" cy="96" r="28" fill="#1E222B" stroke="#ECEDEF" stroke-opacity=".7" stroke-width="2"/>
<text x="340" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#8FA3FF">2</text>
<text x="340" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#ECEDEF">Define</text>
<text x="340" y="194" text-anchor="middle" font-size="15" fill="#8E939C">Requirements you can</text>
<text x="340" y="214" text-anchor="middle" font-size="15" fill="#8E939C">test before the build</text>
<circle cx="540" cy="96" r="28" fill="#1E222B" stroke="#ECEDEF" stroke-opacity=".7" stroke-width="2"/>
<text x="540" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#8FA3FF">3</text>
<text x="540" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#ECEDEF">Design</text>
<text x="540" y="194" text-anchor="middle" font-size="15" fill="#8E939C">Review every design</text>
<text x="540" y="214" text-anchor="middle" font-size="15" fill="#8E939C">before development</text>
<circle cx="740" cy="96" r="28" fill="#1E222B" stroke="#ECEDEF" stroke-opacity=".7" stroke-width="2"/>
<text x="740" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#8FA3FF">4</text>
<text x="740" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#ECEDEF">Prototype</text>
<text x="740" y="194" text-anchor="middle" font-size="15" fill="#8E939C">Let people use the idea</text>
<text x="740" y="214" text-anchor="middle" font-size="15" fill="#8E939C">before we commit</text>
<circle cx="940" cy="96" r="28" fill="#1E222B" stroke="#ECEDEF" stroke-opacity=".7" stroke-width="2"/>
<text x="940" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#8FA3FF">5</text>
<text x="940" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#ECEDEF">Deliver</text>
<text x="940" y="194" text-anchor="middle" font-size="15" fill="#8E939C">Predictable sprints,</text>
<text x="940" y="214" text-anchor="middle" font-size="15" fill="#8E939C">visible risks</text>
<circle cx="1140" cy="96" r="28" fill="#1E222B" stroke="#ECEDEF" stroke-opacity=".7" stroke-width="2"/>
<text x="1140" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#8FA3FF">6</text>
<text x="1140" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#ECEDEF">Release</text>
<text x="1140" y="194" text-anchor="middle" font-size="15" fill="#8E939C">Ship only what meets</text>
<text x="1140" y="214" text-anchor="middle" font-size="15" fill="#8E939C">the agreed criteria</text>
<line x1="72" y1="252" x2="1208" y2="252" stroke="#262A32"/>
<text x="640" y="292" text-anchor="middle" font-size="18" fill="#B4B8C0">AI agents build from my specifications. Every result is reviewed and tested before it counts.</text>
</svg>
