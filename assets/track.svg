<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="How I work: discover, define, design, prototype, deliver, release. AI agents build from my specifications, and every result is reviewed and tested before it counts." font-family="'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>How I work: discover, define, design, prototype, deliver, release. AI agents build from my specifications, and every result is reviewed and tested before it counts.</title>
<defs>
  <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E3044"/><stop offset="1" stop-color="#0B1622"/></linearGradient>
  <pattern id="t-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".05"/></pattern>
</defs>
<rect width="1280" height="330" rx="28" fill="url(#t-bg)"/>
<rect width="1280" height="330" rx="28" fill="url(#t-dots)"/>
<line x1="140" y1="96" x2="1140" y2="96" stroke="#FF9447" stroke-opacity=".45" stroke-width="3"/>
<circle cx="140" cy="96" r="28" fill="#1E3044" stroke="#FF9447" stroke-width="3"/>
<text x="140" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9447">1</text>
<text x="140" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#EEF2F7">Discover</text>
<text x="140" y="194" text-anchor="middle" font-size="15" fill="#8FA3BA">Frame the right problem</text>
<text x="140" y="214" text-anchor="middle" font-size="15" fill="#8FA3BA">with those who have it</text>
<circle cx="340" cy="96" r="28" fill="#1E3044" stroke="#FF9447" stroke-width="3"/>
<text x="340" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9447">2</text>
<text x="340" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#EEF2F7">Define</text>
<text x="340" y="194" text-anchor="middle" font-size="15" fill="#8FA3BA">Requirements you can</text>
<text x="340" y="214" text-anchor="middle" font-size="15" fill="#8FA3BA">test before the build</text>
<circle cx="540" cy="96" r="28" fill="#1E3044" stroke="#FF9447" stroke-width="3"/>
<text x="540" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9447">3</text>
<text x="540" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#EEF2F7">Design</text>
<text x="540" y="194" text-anchor="middle" font-size="15" fill="#8FA3BA">Review every design</text>
<text x="540" y="214" text-anchor="middle" font-size="15" fill="#8FA3BA">before development</text>
<circle cx="740" cy="96" r="28" fill="#1E3044" stroke="#FF9447" stroke-width="3"/>
<text x="740" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9447">4</text>
<text x="740" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#EEF2F7">Prototype</text>
<text x="740" y="194" text-anchor="middle" font-size="15" fill="#8FA3BA">Let people use the idea</text>
<text x="740" y="214" text-anchor="middle" font-size="15" fill="#8FA3BA">before we commit</text>
<circle cx="940" cy="96" r="28" fill="#1E3044" stroke="#FF9447" stroke-width="3"/>
<text x="940" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9447">5</text>
<text x="940" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#EEF2F7">Deliver</text>
<text x="940" y="194" text-anchor="middle" font-size="15" fill="#8FA3BA">Predictable sprints,</text>
<text x="940" y="214" text-anchor="middle" font-size="15" fill="#8FA3BA">visible risks</text>
<circle cx="1140" cy="96" r="28" fill="#1E3044" stroke="#FF9447" stroke-width="3"/>
<text x="1140" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9447">6</text>
<text x="1140" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#EEF2F7">Release</text>
<text x="1140" y="194" text-anchor="middle" font-size="15" fill="#8FA3BA">Ship only what meets</text>
<text x="1140" y="214" text-anchor="middle" font-size="15" fill="#8FA3BA">the agreed criteria</text>
<line x1="72" y1="252" x2="1208" y2="252" stroke="#fff" stroke-opacity=".08"/>
<text x="640" y="292" text-anchor="middle" font-size="18" fill="#C9D3E0">AI agents build from my specifications. Every result is reviewed and tested before it counts.</text>
</svg>
