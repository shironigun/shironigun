<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Mahmood Ahmad, AI Product Analyst. I shape AI products from idea to launch, and build them by directing AI agents." font-family="'Schibsted Grotesk', 'Inter', 'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Mahmood Ahmad, AI Product Analyst. I shape AI products from idea to launch, and build them by directing AI agents.</title>
<style>
  .swing { transform-box: view-box; transform-origin: 1080px 0px; animation: swing 3.8s ease-in-out infinite alternate; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  .legs { transform-box: view-box; transform-origin: 1080px 312px; animation: dangle 3.8s ease-in-out infinite alternate-reverse; }
  .say { opacity: 0; animation: say 12s infinite; }
  .say1 { animation-delay: 3s; } .say2 { animation-delay: 6s; } .say3 { animation-delay: 9s; }
  @keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes dangle { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes say { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .swing, .eye, .legs, .say { animation: none; } .say0 { opacity: 1; } }
</style>
<defs>
  <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161920"/><stop offset="1" stop-color="#0F1115"/></linearGradient>
  <radialGradient id="h-bleed" cx="0" cy="0" r="704" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4A68F2" stop-opacity=".22"/><stop offset="1" stop-color="#4A68F2" stop-opacity="0"/></radialGradient>
  <filter id="h-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .95  0 0 0 0 .9  0 0 0 0 .88  1.2 0 0 0 -.7"/></filter>
  <pattern id="h-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
  <clipPath id="h-clip"><rect width="1280" height="420" rx="28"/></clipPath>
</defs>
<rect width="1280" height="420" rx="28" fill="url(#h-bg)"/>
<rect width="1280" height="420" rx="28" fill="url(#h-bleed)"/>
<rect width="1280" height="420" rx="28" fill="url(#h-dots)"/>
<rect x=".5" y=".5" width="1279" height="419" rx="28" fill="none" stroke="#262A32"/>
<g></g>
<text x="72" y="148" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#ECEDEF">Mahmood Ahmad</text>
<text x="74" y="194" font-size="26" font-weight="600" fill="#8FA3FF">AI Product Analyst</text>
<text x="74" y="262" font-size="28" fill="#B4B8C0">I shape AI products from idea to launch,</text>
<text x="74" y="300" font-size="28" fill="#B4B8C0">and build them by directing AI agents.</text>
<text x="74" y="358" font-size="18" fill="#8E939C">Product first, then design, AI and quality.</text>
<g class="swing">
  <line x1="1080" y1="0" x2="1080" y2="146" stroke="#ECEDEF" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
  <path d="M1050 262 Q1036 196 1074 138" fill="none" stroke="#ECEDEF" stroke-width="9" stroke-linecap="round"/>
  <path d="M1110 262 Q1124 196 1086 128" fill="none" stroke="#ECEDEF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="1074" cy="138" r="9" fill="#B4B8C0"/><circle cx="1086" cy="128" r="9" fill="#B4B8C0"/>
  <line x1="1080" y1="150" x2="1080" y2="168" stroke="#ECEDEF" stroke-width="4"/>
  <circle cx="1080" cy="150" r="6" fill="#8FA3FF"/>
  <rect x="1030" y="166" width="100" height="80" rx="24" fill="#1E222B" stroke="#ECEDEF" stroke-width="3"/>
  <rect x="1044" y="182" width="72" height="44" rx="15" fill="#0F1115"/>
  <circle cx="1066" cy="203" r="11" fill="#A9B8F8" fill-opacity=".16"/><circle cx="1094" cy="203" r="11" fill="#A9B8F8" fill-opacity=".16"/>
  <circle class="eye" cx="1066" cy="203" r="6.5" fill="#A9B8F8"/>
  <circle class="eye" cx="1094" cy="203" r="6.5" fill="#A9B8F8"/>
  <path d="M1068 216 Q1080 224 1092 216" fill="none" stroke="#B4B8C0" stroke-width="3" stroke-linecap="round"/>
  <rect x="1046" y="252" width="68" height="62" rx="18" fill="#1E222B" stroke="#ECEDEF" stroke-width="3"/>
  <circle cx="1080" cy="283" r="7" fill="#8FA3FF"/>
  <g class="legs">
    <path d="M1066 312 L1062 350" stroke="#ECEDEF" stroke-width="8" stroke-linecap="round"/>
    <path d="M1094 312 L1098 350" stroke="#ECEDEF" stroke-width="8" stroke-linecap="round"/>
    <rect x="1048" y="346" width="22" height="12" rx="6" fill="#262A32"/><rect x="1090" y="346" width="22" height="12" rx="6" fill="#262A32"/>
  </g>
  <path d="M1012 196 L1030 204 L1012 212 Z" fill="#ECEDEF"/>
  <rect x="812" y="180" width="202" height="44" rx="16" fill="#ECEDEF"/>
    <text class="say say0" x="912" y="208" text-anchor="middle" font-size="17" font-weight="650" fill="#0F1115">Specs first.</text>
    <text class="say say1" x="912" y="208" text-anchor="middle" font-size="17" font-weight="650" fill="#0F1115">Agents write the code.</text>
    <text class="say say2" x="912" y="208" text-anchor="middle" font-size="17" font-weight="650" fill="#0F1115">You approve writes.</text>
    <text class="say say3" x="912" y="208" text-anchor="middle" font-size="17" font-weight="650" fill="#0F1115">Facts before claims.</text>
</g>
</svg>
