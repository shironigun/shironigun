<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="196" viewBox="0 0 1280 196" role="img" aria-label="Now: leading AI feature definition, prototyping and evaluation, alongside the QA team. Learning machine learning and AI evaluation. Proof: 10 Claude Code plugins, 38 skills. Quality Gates adopted by 3 teams. 1st of 11 teams in an AI hackathon. A 183-page guide to working with Claude." font-family="'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif">
