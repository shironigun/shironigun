  .caret { animation: caret 1s steps(1) infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes line { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
  @keyframes type { 0% { transform: scaleX(0); } 9%, 100% { transform: scaleX(1); } }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .line, .type, .caret { animation: none; } .line { opacity: 0; } .line:first-of-type { opacity: 1; } }
</style>
